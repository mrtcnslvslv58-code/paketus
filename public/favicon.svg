<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="favEmerald" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="favCyan" x1="12" y1="20" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="favGlow" x="8" y="8" width="48" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Route Loop Track -->
  <path d="M18 42C14 34 16 22 25 18C33 14 43 18 46 25C49 32 44 42 36 45" 
        stroke="url(#favCyan)" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Isometric Modern Parcel Box -->
  <g filter="url(#favGlow)">
    <!-- Top Face -->
    <path d="M32 14L46 22L32 30L18 22Z" fill="#34d399"/>
    <!-- Left Face -->
    <path d="M18 22L32 30V48L18 40Z" fill="url(#favEmerald)"/>
    <!-- Right Face -->
    <path d="M32 30L46 22V40L32 48Z" fill="#047857"/>
    <!-- Seam & Fast Ribbon -->
    <path d="M32 14V30M32 30V48" stroke="#064e3b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 18L39 26" stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Navigation Waypoint Pin Dot -->
  <circle cx="47" cy="45" r="4.5" fill="#38bdf8"/>
  <circle cx="47" cy="45" r="2" fill="#ffffff"/>
  <circle cx="47" cy="45" r="7" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
</svg>
